name: Deploy StudyOrbital

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          for file in ./*.js; do node --check "$file"; done
      - name: Validate release assets and isolation
        run: python3 scripts/validate_release.py
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -f ./*.html ./*.js ./*.css ./*.json ./*.png _site/
          cp -f .nojekyll _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
